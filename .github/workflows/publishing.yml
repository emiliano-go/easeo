name: Publish

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # CI Tests (blocker)
  # ===========================================================================

  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  test-python:
    name: Python Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build and install the Python package
        # `pip install .` builds the extension via the maturin backend and
        # works on all runners; `maturin develop` requires a virtualenv.
        run: python -m pip install .
      - name: Run Python tests
        run: python -m pytest tests/python/ -v

  test-node:
    name: Node Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@^3
      - name: Build native module
        run: cd packages/core && napi build --platform --release --manifest-path ../../crates/easeo-node/Cargo.toml && cp ../../crates/easeo-node/*.node .
      - name: Run Node tests
        # bash expands the glob on every runner; pwsh on Windows does not,
        # and `node --test <dir>` is not supported on Node 20/22.
        shell: bash
        run: node --test tests/javascript/*.cjs

  conformance:
    name: Cross-Language Conformance
    runs-on: ubuntu-latest
    needs: [test-rust, test-python, test-node]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install maturin && npm install -g @napi-rs/cli@^3
      - name: Build all packages
        run: |
          maturin build --release -m crates/easeo-python/Cargo.toml --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd packages/core && napi build --platform --release --manifest-path ../../crates/easeo-node/Cargo.toml && cp ../../crates/easeo-node/*.node .
      - name: Run conformance test
        run: python tests/conformance/test_conformance.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # ===========================================================================
  # Build PyPI wheels (multi-platform)
  # ===========================================================================

  build-pypi:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [conformance, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist -m crates/easeo-python/Cargo.toml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ===========================================================================
  # Build npm package
  # ===========================================================================

  build-npm:
    name: Build npm binding (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [conformance, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: "true"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: "true"
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@^3
      - name: Build native module
        working-directory: packages/core
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          CROSS_ARGS=""
          if [ "${{ matrix.cross }}" = "true" ]; then CROSS_ARGS="--use-napi-cross"; fi
          napi build --platform --release --target ${{ matrix.target }} $CROSS_ARGS \
            --manifest-path ../../crates/easeo-node/Cargo.toml
          cp ../../crates/easeo-node/*.node .
      - name: Upload binding
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/core/*.node
          if-no-files-found: error

  # ===========================================================================
  # Publish to PyPI (OIDC trusted publishing)
  # ===========================================================================

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-pypi
    environment:
      name: pypi
      url: https://pypi.org/project/easeo
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ===========================================================================
  # Publish to npm (OIDC trusted publishing)
  # ===========================================================================

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-npm
    environment:
      name: npm
      url: https://www.npmjs.com/package/@easeo/core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Download all bindings
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          merge-multiple: true
          path: packages/core/
      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/core/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # First publish of a new package cannot use OIDC trusted publishing, so these
  # use NPM_TOKEN. Switch to OIDC once each package exists on the registry.

  publish-integrations:
    name: Publish @easeo/${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        package: [next, vite, astro, nuxt, sveltekit, react]
    environment:
      name: npm
      url: https://www.npmjs.com/package/@easeo/${{ matrix.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: integrations/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
