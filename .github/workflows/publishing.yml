name: Publish

on:
  release:
    types: [published]
  # Manual runs only build/test; publishing is gated to release events.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # CI Tests (blocker)
  # ===========================================================================

  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  test-python:
    name: Python Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build and install the Python package
        # `pip install .` builds the extension via the maturin backend and
        # works on all runners; `maturin develop` requires a virtualenv.
        # The adapter extras install FastAPI, Django, and Flask for their tests.
        run: python -m pip install ".[fastapi,django,flask]"
      - name: Run Python tests
        run: python -m pytest tests/python/ -v

  test-node:
    name: Node Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@^3
      - name: Build native module
        run: cd packages/core && napi build --platform --release --manifest-path ../../crates/easeo-node/Cargo.toml && cp ../../crates/easeo-node/*.node .
      - name: Install TypeScript
        run: npm install -g typescript
      - name: Type-check the declarations
        run: tsc --noEmit --strict --lib "es2022,dom" --module esnext --moduleResolution bundler tests/javascript/types-consumer.ts
      - name: Run Node tests
        # bash expands the glob on every runner; pwsh on Windows does not,
        # and `node --test <dir>` is not supported on Node 20/22.
        shell: bash
        run: node --test tests/javascript/*.cjs

  conformance:
    name: Cross-Language Conformance
    runs-on: ubuntu-latest
    needs: [test-rust, test-python, test-node]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install maturin && npm install -g @napi-rs/cli@^3
      - name: Build all packages
        run: |
          maturin build --release -m crates/easeo-python/Cargo.toml --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd packages/core && napi build --platform --release --manifest-path ../../crates/easeo-node/Cargo.toml && cp ../../crates/easeo-node/*.node .
      - name: Run conformance test
        run: python tests/conformance/test_conformance.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # ===========================================================================
  # Build PyPI wheels (multi-platform)
  # ===========================================================================

  build-pypi:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [conformance, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi3 wheels only need one interpreter >= 3.10; the manylinux
          # containers do not necessarily default to one, so pin it there.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            interpreter: python3.10
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            interpreter: python3.10
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      # Host builds (macOS/Windows) need an interpreter >= 3.10 for abi3.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist -m crates/easeo-python/Cargo.toml ${{ matrix.interpreter && format('-i {0}', matrix.interpreter) || '' }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ===========================================================================
  # Build npm package
  # ===========================================================================

  build-npm:
    name: Build npm binding (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [conformance, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: "true"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: "true"
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@^3
      # musl builds use cargo-zigbuild (napi build -x), which needs zig.
      - uses: mlugg/setup-zig@v2
        if: matrix.musl
        with:
          version: "0.15.2"
      - name: Build native module
        working-directory: packages/core
        shell: bash
        run: |
          CROSS_ARGS=""
          if [ "${{ matrix.cross }}" = "true" ]; then CROSS_ARGS="--use-napi-cross"; fi
          if [ "${{ matrix.musl }}" = "true" ]; then CROSS_ARGS="-x"; fi
          napi build --platform --release --target ${{ matrix.target }} $CROSS_ARGS \
            --manifest-path ../../crates/easeo-node/Cargo.toml
          cp ../../crates/easeo-node/*.node .
      - name: Upload binding
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/core/*.node
          if-no-files-found: error

  # ===========================================================================
  # Publish to PyPI (OIDC trusted publishing)
  # ===========================================================================

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-pypi
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/easeo
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Re-runs after a partial failure can upload files PyPI already has.
          skip-existing: true

  # ===========================================================================
  # Publish easeo-core to crates.io (OIDC trusted publishing)
  # ===========================================================================

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [conformance, lint]
    if: github.event_name == 'release'
    environment:
      name: crates
      url: https://crates.io/crates/easeo-core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The first 0.1.0 publish is done manually (trusted publishing cannot
      # create a crate), so skip gracefully when the version already exists.
      - name: Check whether this version is already on crates.io
        id: check
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "easeo-core") | .version')
          if curl -sf -H "User-Agent: easeo-release-ci" "https://crates.io/api/v1/crates/easeo-core/${VERSION}" > /dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.already == 'false'
        id: auth
      - name: Publish easeo-core
        if: steps.check.outputs.already == 'false'
        run: cargo publish -p easeo-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ===========================================================================
  # Publish to npm (OIDC trusted publishing)
  # ===========================================================================

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-npm
    if: github.event_name == 'release'
    environment:
      name: npm
      url: https://www.npmjs.com/package/@easeo/core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Download all bindings
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          merge-multiple: true
          path: packages/core/
      # 0.1.0 was published manually (OIDC cannot create a package), so skip
      # already-published versions on re-runs. Authenticates via OIDC.
      - name: Check whether this version is already on npm
        id: check
        working-directory: packages/core/
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@easeo/core@${VERSION}" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.already == 'false'
        run: npm publish --access public
        working-directory: packages/core/

  publish-integrations:
    name: Publish @easeo/${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: publish-npm
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        package: [next, vite, astro, nuxt, sveltekit, react]
    environment:
      name: npm
      url: https://www.npmjs.com/package/@easeo/${{ matrix.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Check whether this version is already on npm
        id: check
        working-directory: integrations/${{ matrix.package }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@easeo/${{ matrix.package }}@${VERSION}" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.already == 'false'
        run: npm publish --access public
        working-directory: integrations/${{ matrix.package }}
