name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The real MSRV is 1.88: pyo3 0.29 requires 1.83, and locked
        # dependencies (icu_* via url, napi-build) require 1.88. See
        # rust-version in Cargo.toml.
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  test-python:
    name: Python Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build and install the Python package
        # `pip install .` builds the extension via the maturin backend and
        # works on all runners; `maturin develop` requires a virtualenv.
        run: python -m pip install .
      - name: Run Python tests
        run: python -m pytest tests/python/ -v

  test-node:
    name: Node Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # @napi-rs/cli 3.x requires Node 20 or newer.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@^3
      - name: Build native module
        run: cd packages/core && napi build --platform --release --manifest-path ../../crates/easeo-node/Cargo.toml && cp ../../crates/easeo-node/*.node .
      - name: Run Node tests
        # Pass the directory rather than a glob: pwsh on Windows does not
        # expand '*.cjs', and Node discovers the test files itself.
        run: node --test tests/javascript

  conformance:
    name: Cross-Language Conformance
    runs-on: ubuntu-latest
    needs: [test-rust, test-python, test-node]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install maturin && npm install -g @napi-rs/cli@^3
      - name: Build all packages
        run: |
          maturin build --release -m crates/easeo-python/Cargo.toml --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd packages/core && napi build --platform --release --manifest-path ../../crates/easeo-node/Cargo.toml && cp ../../crates/easeo-node/*.node .
      - name: Run conformance test
        run: python tests/conformance/test_conformance.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
