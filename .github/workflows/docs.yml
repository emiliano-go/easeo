name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "python/easeo/**"
      - "crates/**"
      - "pyproject.toml"
      - "scripts/build_docs.sh"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "python/easeo/**"
      - "crates/**"
      - "pyproject.toml"
      - "scripts/build_docs.sh"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# The site is deployed by Cloudflare Pages from the same repository, so this
# workflow only validates that the docs build with the local easeo. It does
# not deploy to GitHub Pages (which is not enabled for this project).
permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the docs with the local easeo
        run: bash scripts/build_docs.sh
      - name: Verify the site was produced
        run: test -f site/index.html
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          if-no-files-found: error
