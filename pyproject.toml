[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "easeo"
version = "0.1.0"
description = "Deterministic SEO payload generation for content platforms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Emiliano Gandini Outeda", email = "emiliano.gandini@protonmail.com"}
]
keywords = ["seo", "canonical", "urls", "metadata", "open-graph", "twitter-cards", "json-ld", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
django = ["django>=4.0"]
flask = ["flask>=2.3"]
zensical = ["zensical", "markdown>=3.5"]
all = [
    "fastapi>=0.100",
    "django>=4.0",
    "flask>=2.3",
    "zensical",
    "markdown>=3.5",
]

[project.urls]
Homepage = "https://github.com/emiliano-go/easeo"
Documentation = "https://github.com/emiliano-go/easeo#readme"
Repository = "https://github.com/emiliano-go/easeo"
Changelog = "https://github.com/emiliano-go/easeo/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "pytest>=8.0",
    "zensical",
    "markdown>=3.5",
]

[tool.maturin]
# The workspace root Cargo.toml has no [package], so point maturin at the
# Python crate explicitly. Without this, `uv run` / `pip install .` try to
# build the root manifest and fail with "missing field `package`".
manifest-path = "crates/easeo-python/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "easeo._easeo_native"
python-source = "python"
