[project]
site_name = "easeo"
site_description = "Deterministic SEO metadata generation for content platforms"
site_url = "https://easeo.emiliano-go.com/"
docs_dir = "docs"
site_dir = "site"

copyright = "&copy; 2026 Emiliano Gandini Outeda"

# ==============================================================================
# Theme
# ==============================================================================

[project.theme]
variant = "modern"
custom_dir = "overrides"

# ==============================================================================
# Markdown extensions
# ==============================================================================

[project.markdown_extensions]
tables = {}
admonition = {}
toc = { permalink = true }
"easeo.contrib.zensical" = {
  canonical_host = "easeo.emiliano-go.com",
  public_base_url = "https://easeo.emiliano-go.com/",
  site_name = "easeo",
  title_template = "{title} - easeo",
  publisher_name = "Emiliano Gandini Outeda",
  locale = "en_US",
  twitter_site = "@emiliano_go_",
  auto_generate_schema = true,
  debug_dir = ".seo-debug",
}

[project.markdown_extensions.pymdownx]
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
inlinehilite = {}
snippets = {}
superfences = {}
tabbed = { alternate_style = true }
tasklist = { custom_checkbox = true }

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]
